<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта событий Челябинска</title>
    
    <!-- Leaflet (только по HTTPS) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .popup-box {
            font-size: 13px;
            line-height: 1.4;
        }
        .popup-title {
            font-weight: bold;
            color: #1a1a2e;
            font-size: 14px;
        }
        .popup-time {
            color: #e94560;
            font-weight: bold;
            margin: 3px 0;
            display: block;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // Инициализация карты Челябинска
        var map = L.map('map', {
            zoomControl: true
        }).setView([55.1604, 61.4026], 13);

        // Слой карты OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap | Коммерсантъ',
            maxZoom: 18
        }).addTo(map);

        // Тестовые точки
        var points = [
            { name: 'Площадь Революции (Главная сцена)', time: '10:00–22:00', desc: 'Праздничный концерт и открытие', lat: 55.1604, lng: 61.4026 },
            { name: 'Пешеходная Кировка', time: '10:00–19:00', desc: 'Ярмарка и мастер-классы мастеров', lat: 55.1644, lng: 61.4370 },
            { name: 'Набережная реки Миасс', time: '22:00', desc: 'Праздничный салют', lat: 55.1570, lng: 61.3950 }
        ];

        points.forEach(function(pt) {
            var marker = L.marker([pt.lat, pt.lng]).addTo(map);
            marker.bindPopup(
                '<div class="popup-box">' +
                '<div class="popup-title">📍 ' + pt.name + '</div>' +
                '<span class="popup-time">🕐 ' + pt.time + '</span>' +
                '<div>' + pt.desc + '</div>' +
                '</div>'
            );
        });
    </script>
</body>
</html>
