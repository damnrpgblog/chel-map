<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>День города Челябинска — Спецпроект</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            /* Фирменные цвета Коммерсанта */
            --brand-primary: rgb(0, 68, 101);
            --brand-primary-hover: rgb(0, 50, 80);
            --brand-white: rgb(255, 255, 255);
            
            /* Фоны и текст */
            --bg-app: #f4f7f9;
            --bg-panel: #ffffff;
            --border-light: #e2e8f0;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            
            /* Тени */
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0, 68, 101, 0.08);
            --shadow-hover: 0 8px 16px rgba(0, 68, 101, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: auto !important;
            overflow: hidden !important;
            background: var(--bg-app);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-dark);
        }

        .leaflet-control-attribution {
            display: none !important;
        }

        /* ШАПКА */
        .app-header {
            background: var(--brand-primary);
            color: var(--brand-white);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title {
            font-size: 16px;
            font-weight: 700;
        }

        .app-title span {
            font-weight: 400;
            opacity: 0.9;
        }

        .app-badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .app-body {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* КВАДРАТНЫЙ ВЬЮПОРТ КАРТЫ */
        .map-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            background: #e5e5e5;
            border-bottom: 2px solid var(--brand-primary);
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 100%;
            background: var(--bg-panel);
            display: flex;
            flex-direction: column;
        }

        /* Фильтры */
        .filter-bar {
            padding: 12px 16px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }
        .filter-bar::-webkit-scrollbar { display: none; }

        .filter-chip {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-light);
            background: var(--bg-app);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-gray);
        }

        .filter-chip.active {
            background: var(--brand-primary);
            color: var(--brand-white);
            border-color: var(--brand-primary);
        }

        /* ПАНЕЛЬ МАРШРУТА */
        .route-summary-panel {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-light);
            padding: 14px 16px;
            box-shadow: var(--shadow-sm);
        }

        .route-stats {
            font-size: 13px;
            margin-bottom: 10px;
            line-height: 1.4;
            color: var(--text-gray);
        }
        .route-stats strong { color: var(--text-dark); font-weight: 600; }

        .conflict-alert {
            background: #fff8e6;
            color: #926c07;
            border: 1px solid #fcebb6;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
            margin-bottom: 10px;
            display: none;
        }
        .conflict-alert.visible { display: block; }

        .btn-group { display: flex; gap: 8px; }
        .btn {
            padding: 11px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            flex: 1;
            text-align: center;
        }
        .btn-primary { background: var(--brand-primary); color: var(--brand-white); }
        .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; }
        .btn-outline { background: transparent; border: 1px solid var(--border-light); color: var(--text-gray); flex: 0.3; }

        /* СПИСОК СОБЫТИЙ */
        .events-list {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--bg-app);
            overflow: visible !important;
            height: auto !important;
        }

        .event-card {
            background: var(--brand-white);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            box-shadow: var(--shadow-sm);
        }

        .event-card.selected {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 1px var(--brand-primary), var(--shadow-sm);
        }

        .event-card-checkbox {
            margin-top: 2px;
            width: 18px;
            height: 18px;
            accent-color: var(--brand-primary);
            flex-shrink: 0;
        }

        .event-card-content { flex: 1; min-width: 0; }

        .event-category-tag {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--brand-primary);
            background: rgba(0, 68, 101, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 4px;
        }

        .event-title {
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 4px;
            color: var(--text-dark);
        }

        .event-meta {
            font-size: 12px;
            color: var(--text-gray);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .event-time-badge { color: var(--text-dark); font-weight: 600; }

        .order-badge {
            width: 24px;
            height: 24px;
            background: var(--brand-primary);
            color: var(--brand-white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            flex-shrink: 0;
        }

        /* КРУГЛЫЕ МАРКЕРЫ */
        .category-marker-pin {
            background: var(--brand-primary);
            color: var(--brand-white);
            border: 2px solid var(--brand-white);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(0, 68, 101, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .category-marker-pin:hover {
            transform: scale(1.2);
            box-shadow: 0 6px 14px rgba(0, 68, 101, 0.5);
        }

        .route-number-pin {
            background: #c82333;
            color: var(--brand-white);
            border: 2px solid var(--brand-white);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(200, 35, 51, 0.5);
            transition: transform 0.2s ease;
        }

        .route-number-pin:hover {
            transform: scale(1.2);
        }

        .leaflet-tile-pane { filter: contrast(95%) saturate(60%) brightness(105%); }
        .leaflet-popup-content-wrapper { border-radius: 12px; padding: 0; box-shadow: var(--shadow-hover); }
        .leaflet-popup-content { margin: 0; }
        .popup-card { padding: 14px; min-width: 220px; font-size: 12px; line-height: 1.4; }
        .popup-card h4 { font-size: 14px; margin: 4px 0; color: var(--text-dark); }
        .popup-btn { width: 100%; padding: 8px; border-radius: 6px; background: var(--brand-primary); color: white; border: none; margin-top: 10px; font-weight: 600; }
        .popup-btn.selected { background: var(--bg-app); color: var(--brand-primary); border: 1px solid var(--brand-primary); }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="app-title">12 сентября <span>/ Гид ко Дню города</span></div>
        <div class="app-badge">Коммерсантъ</div>
    </header>

    <div class="app-body">
        <main class="map-wrapper">
            <div id="map"></div>
        </main>

        <aside class="sidebar">
            <div class="filter-bar">
                <button class="filter-chip active" data-cat="all">Все</button>
                <button class="filter-chip" data-cat="concert">Концерты & Стендап</button>
                <button class="filter-chip" data-cat="show">Шоу & Вечеринки</button>
                <button class="filter-chip" data-cat="art">Арт & Технологии</button>
                <button class="filter-chip" data-cat="sport">Экстрим</button>
                <button class="filter-chip" data-cat="fest">Еда</button>
            </div>

            <div class="route-summary-panel">
                <div class="conflict-alert" id="conflictAlert">
                    ⚠️ Время некоторых событий пересекается.
                </div>
                <div class="route-stats" id="routeStats">
                    Отметьте события в списке ниже, чтобы составить график.
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="btnFitRoute" disabled>Смотреть маршрут на карте</button>
                    <button class="btn btn-outline" id="btnClear">Сброс</button>
                </div>
            </div>

            <div class="events-list" id="eventsList"></div>
        </aside>
    </div>

    <script>
        // ===== УТОЧНЕННЫЕ КООРДИНАТЫ ДЛЯ ЧЕЛЯБИНСКА =====
        const eventsData = [
            { id: 15, name: 'Сольный стендап Андрея Атласа (18+)', category: 'concert', categoryLabel: 'Концерты', icon: '🎤', timeText: '19:00 – 20:30', startHour: 19.0, endHour: 20.5, address: 'Стендап клуб (ул. Ленина, 66)', desc: 'Резидент Stand Up на ТНТ. Сбор в 18:00.', lat: 55.1606216, lng: 61.3805545 },
            { id: 14, name: 'Детская шоу-игра «НеРеалити»', category: 'show', categoryLabel: 'Шоу', icon: '🎭', timeText: '18:00 – 20:00', startHour: 18.0, endHour: 20.0, address: 'Лофт «Семья» (ул. Сталеваров, 5д)', desc: 'Челленджи, животные, DJ. Запись: 8-951-487-55-56.', lat: 55.262864, lng: 61.4046565 },
            { id: 13, name: 'Праздник «День цифры»', category: 'art', categoryLabel: 'Арт & Тех', icon: '🤖', timeText: '10:00 – 16:00', startHour: 10.0, endHour: 16.0, address: 'Горсад им. А.С. Пушкина', desc: 'VR, роботы, профориентация.', lat: 55.1548939, lng: 61.4014253 },
            { id: 11, name: 'Концерт в «Парковом Премиум»', category: 'concert', categoryLabel: 'Концерты', icon: '🎵', timeText: '13:00 – 14:00', startHour: 13.0, endHour: 14.0, address: 'мкр. «Парковый Премиум»', desc: 'Народные песни и танцы.', lat: 55.2330, lng: 61.2725 },
            { id: 12, name: 'Оркестр «Парус» в «Привилегии»', category: 'concert', categoryLabel: 'Концерты', icon: '🎷', timeText: '17:00 – 19:00', startHour: 17.0, endHour: 19.0, address: 'мкр. «Привилегия» (Западный)', desc: 'Джаз и хиты советского рока.', lat: 55.1325, lng: 61.2290 },
            { id: 10, name: 'Фестиваль в «РМК Экстрим»', category: 'sport', categoryLabel: 'Экстрим', icon: '🛹', timeText: '10:30 – 19:00', startHour: 10.5, endHour: 19.0, address: 'Скейт-парк у Торгового Центра', desc: 'BMX, скейт, стритбол, слэм-данк шоу.', lat: 55.17373098944806, lng: 61.39017345437165 },
            { id: 1, name: 'Фестиваль индустрий «ШКИпер»', category: 'art', categoryLabel: 'Арт & Тех', icon: '🎨', timeText: '12:00', startHour: 12.0, endHour: 15.0, address: 'Тополиная аллея (ул. Ак. Королева)', desc: 'Видеосборка и презентации.', lat: 55.163214485032775, lng: 61.29553144348386 },
            { id: 2, name: 'Гастрофестиваль «Блюда от верблюда»', category: 'fest', categoryLabel: 'Еда', icon: '🍔', timeText: '12:00 – 18:00', startHour: 12.0, endHour: 18.0, address: 'Набережная р. Миасс (у Музея)', desc: 'Угощения от уральских шефов.', lat: 55.1685281, lng: 61.4008864 },
            { id: 3, name: 'Фестиваль «ЧелТрансФест»', category: 'fest', categoryLabel: 'Фестивали', icon: '🚌', timeText: '13:00 – 17:00', startHour: 13.0, endHour: 17.0, address: 'ул. Карла Маркса / Кировка', desc: 'Выставка общественного транспорта.', lat: 55.165510, lng: 61.407115 },
            { id: 4, name: 'Праздник радио «Континенталь»', category: 'concert', categoryLabel: 'Концерты', icon: '📻', timeText: '17:00 – 21:00', startHour: 17.0, endHour: 21.0, address: 'Арт-сквер, Набережная', desc: 'Звезды эстрады, конкурсы.', lat: 55.16869529573645, lng: 61.40326270484108 },
            { id: 5, name: 'Концерт со звездами эстрады', category: 'concert', categoryLabel: 'Концерты', icon: '🎤', timeText: '17:00 – 21:30', startHour: 17.0, endHour: 21.5, address: 'Торговый центр (Каслинская, 64)', desc: 'Главный концерт города.', lat: 55.1720, lng: 61.3965 },
            { id: 6, name: 'Флайборд-шоу', category: 'show', categoryLabel: 'Шоу', icon: '🌊', timeText: '21:45 – 22:00', startHour: 21.75, endHour: 22.0, address: 'Акватория р. Миасс (у ТЦ)', desc: 'Трюки на гидроциклах.', lat: 55.1710, lng: 61.3975 },
            { id: 7, name: 'Праздничный фейерверк', category: 'show', categoryLabel: 'Шоу', icon: '🎆', timeText: '22:00 – 22:20', startHour: 22.0, endHour: 22.33, address: 'Набережная р. Миасс', desc: 'Кульминация Дня города.', lat: 55.1690, lng: 61.3985 },
            { id: 8, name: 'Выставка «Игра. Цифра»', category: 'art', categoryLabel: 'Арт & Тех', icon: '💻', timeText: '10:00 – 20:00', startHour: 10.0, endHour: 20.0, address: 'ул. Труда, 183', desc: 'Мультимедийные инсталляции.', lat: 55.1688, lng: 61.3730 },
            { id: 9, name: 'Урал в сказаниях', category: 'art', categoryLabel: 'Арт & Тех', icon: '🖼️', timeText: '09:00 – 21:00', startHour: 9.0, endHour: 21.0, address: 'Галерея «Люба Петя» (Лесопарковая, 5)', desc: 'Уральский фольклор в картинах.', lat: 55.1540, lng: 61.3620 }
        ];

        let selectedIds = new Set();
        let currentFilter = 'all';
        let map, routePolyline = null, routePinMarkers = [];
        let baseMarkers = {};

        function initMap() {
            map = L.map('map', { 
                zoomControl: false, 
                attributionControl: false,
                scrollWheelZoom: false 
            }).setView([55.1700, 61.3700], 11);

            L.control.zoom({ position: 'topright' }).addTo(map);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 18
            }).addTo(map);

            eventsData.forEach(evt => {
                const iconHtml = `<div class="category-marker-pin">${evt.icon}</div>`;
                const customIcon = L.divIcon({
                    html: iconHtml,
                    className: '',
                    iconSize: [32, 32],
                    iconAnchor: [16, 16],
                    popupAnchor: [0, -16]
                });

                const marker = L.marker([evt.lat, evt.lng], { icon: customIcon }).addTo(map);
                marker.bindPopup(createPopupHtml(evt));
                baseMarkers[evt.id] = marker;
            });
            
            setTimeout(() => map.invalidateSize(), 400);
        }

        function createPopupHtml(evt) {
            const isSel = selectedIds.has(evt.id);
            return `<div class="popup-card">
                        <span class="event-category-tag">${evt.categoryLabel}</span>
                        <h4>${evt.icon} ${evt.name}</h4>
                        <div class="time">🕒 ${evt.timeText}</div>
                        <div style="font-size: 11px; color: #64748b; margin-bottom: 6px;">📍 ${evt.address}</div>
                        <button class="popup-btn ${isSel ? 'selected' : ''}" onclick="toggleSelect(${evt.id})">
                            ${isSel ? '✓ В маршруте' : '+ Добавить'}
                        </button>
                    </div>`;
        }

        function renderSidebar() {
            const container = document.getElementById('eventsList');
            const ordered = eventsData.filter(e => selectedIds.has(e.id)).sort((a,b) => a.startHour - b.startHour);
            const filtered = eventsData.filter(e => currentFilter === 'all' || e.category === currentFilter);

            container.innerHTML = filtered.map(evt => {
                const isSelected = selectedIds.has(evt.id);
                const orderIdx = ordered.findIndex(e => e.id === evt.id);
                return `
                    <div class="event-card ${isSelected ? 'selected' : ''}" onclick="toggleSelect(${evt.id})">
                        <input type="checkbox" class="event-card-checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleSelect(${evt.id})">
                        <div class="event-card-content">
                            <span class="event-category-tag">${evt.categoryLabel}</span>
                            <div class="event-title">${evt.icon} ${evt.name}</div>
                            <div class="event-meta">
                                <span class="event-time-badge">🕒 ${evt.timeText}</span>
                                <span>📍 ${evt.address}</span>
                            </div>
                        </div>
                        ${isSelected ? `<div class="order-badge">${orderIdx + 1}</div>` : ''}
                    </div>`;
            }).join('');
        }

        window.toggleSelect = function(id) {
            selectedIds.has(id) ? selectedIds.delete(id) : selectedIds.add(id);
            updateApp();
        };

        function updateApp() {
            const ordered = eventsData.filter(e => selectedIds.has(e.id)).sort((a,b) => a.startHour - b.startHour);
            renderSidebar();
            
            eventsData.forEach(evt => baseMarkers[evt.id].setPopupContent(createPopupHtml(evt)));
            
            document.getElementById('btnFitRoute').disabled = ordered.length < 2;
            
            if(ordered.length < 2) {
                document.getElementById('routeStats').innerHTML = 'Отметьте события в списке ниже, чтобы составить график.';
                document.getElementById('conflictAlert').classList.remove('visible');
                drawRoute(ordered);
            } else {
                let hasConflict = false;
                for(let i=0; i<ordered.length-1; i++){
                    if(ordered[i].endHour > ordered[i+1].startHour) hasConflict = true;
                }
                document.getElementById('conflictAlert').classList.toggle('visible', hasConflict);
                drawRoute(ordered);
            }
        }

        async function drawRoute(ordered) {
            if(routePolyline) { map.removeLayer(routePolyline); routePolyline = null; }
            routePinMarkers.forEach(m => map.removeLayer(m));
            routePinMarkers = [];
            
            if(ordered.length < 2) return;

            ordered.forEach((evt, idx) => {
                const icon = L.divIcon({ 
                    html: `<div class="route-number-pin">${idx+1}</div>`, 
                    className: '', 
                    iconSize:[32,32], 
                    iconAnchor:[16,16] 
                });
                routePinMarkers.push(L.marker([evt.lat, evt.lng], {icon, zIndexOffset:1000}).addTo(map));
            });

            const coordsStr = ordered.map(e => `${e.lng},${e.lat}`).join(';');
            const osrmUrl = `https://router.project-osrm.org/route/v1/foot/${coordsStr}?overview=full&geometries=geojson`;

            try {
                const response = await fetch(osrmUrl);
                const data = await response.json();

                if (data.code === 'Ok' && data.routes.length > 0) {
                    const route = data.routes[0];
                    const pathCoords = route.geometry.coordinates.map(coord => [coord[1], coord[0]]);
                    
                    routePolyline = L.polyline(pathCoords, { 
                        color: 'rgb(0,68,101)', 
                        weight: 4, 
                        opacity: 0.85,
                        lineCap: 'round',
                        lineJoin: 'round'
                    }).addTo(map);

                    const distanceKm = (route.distance / 1000).toFixed(1);
                    const walkMinutes = Math.round(route.duration / 60);
                    
                    document.getElementById('routeStats').innerHTML = `Событий: <strong>${ordered.length}</strong> | Пешком по городу: <strong>~${distanceKm} км</strong> (около ${walkMinutes} мин)`;
                } else {
                    throw new Error('Маршрут не найден');
                }
            } catch (err) {
                const fallbackCoords = ordered.map(e => [e.lat, e.lng]);
                routePolyline = L.polyline(fallbackCoords, { color: 'rgb(0,68,101)', weight: 3, dashArray: '8,8' }).addTo(map);
                document.getElementById('routeStats').innerHTML = `Событий: <strong>${ordered.length}</strong> в маршруте`;
            }
        }

        document.getElementById('btnClear').addEventListener('click', () => { selectedIds.clear(); updateApp(); map.setView([55.1700, 61.3700], 11); });
        
        document.getElementById('btnFitRoute').addEventListener('click', () => {
            if(routePinMarkers.length > 0) {
                map.fitBounds(L.featureGroup(routePinMarkers).getBounds().pad(0.2));
            }
        });

        document.querySelectorAll('.filter-chip').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.cat;
                renderSidebar();
            });
        });

        initMap();
        renderSidebar();
    </script>
</body>
</html>
